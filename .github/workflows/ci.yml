name: CI

# The pinned Python 3.10 image builds and the backend suite passes on every
# push / PR. The nightly/weekly pipelines stay DARK until launch.
on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend suite (Docker 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned Python 3.10 image
        run: docker build -t chalk-backend backend
      - name: Run pytest in the image
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/app/backend" \
            chalk-backend python -m pytest tests/ -q
