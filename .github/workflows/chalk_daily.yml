name: CHALK Daily (green pipeline)

# The 🟢 deterministic daily chain (ARCHITECTURE §6A / OPS_RUNBOOK §3): grade yesterday
# -> refresh -> predict + lock + render -> run the day's experiment -> draft -> guardrail
# -> enqueue -> assemble the approval batch.
#
# DARK until launch: the schedule is DISABLED, AUTONOMY_MODE=approve_all, CHALK_DRY_RUN=1,
# and no publisher creds are set, so it NEVER posts; it only lands drafts in the queue.
# At go-live (M6) the owner uncomments the cron, adds the platform secrets, and flips
# CHALK_DRY_RUN=0. Every credential comes from GitHub Actions encrypted secrets (§5k).
on:
  # schedule:
  #   - cron: '0 8 * * *'    # 08:00 UTC daily (after games): enable at launch
  workflow_dispatch:
    inputs:
      sport:
        description: sport to run
        default: nfl

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTONOMY_MODE: approve_all      # never auto-post
      CHALK_DRY_RUN: "1"             # dark until go-live
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      # X / Reddit / IG creds are referenced at launch; unset => publishers stay dry-run.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install --no-deps nfl_data_py==0.3.3
      - name: Run the CHALK daily pipeline (dark, drafts only, no posts)
        run: |
          cd backend
          python -m agent.daily_run --sport "${{ github.event.inputs.sport || 'nfl' }}" --force-experiment
      - name: Scheduled agent, assemble the approval batch (cautious; posts nothing)
        run: |
          cd backend
          python -m agent.agent_run
