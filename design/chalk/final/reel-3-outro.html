<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px}
  .reel{width:1080px;height:1920px;background:#16130F;color:#F4F1EA;font-family:'Inter',sans-serif;position:relative;padding:110px 80px 96px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:60px;letter-spacing:-1px;color:#F4F1EA}.word .dot{color:#E7473C}
  .date{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:2px;color:#9A9184;text-transform:uppercase}
  .kick{margin-top:130px;font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:10px;color:#E7473C;text-transform:uppercase}
  .h1{margin-top:34px;font-family:'Fraunces',serif;font-weight:700;font-size:130px;line-height:.9;letter-spacing:-3px}
  .h1 b{color:#E7473C}
  .season{margin-top:56px;border-top:1px solid #ffffff1f;padding-top:40px;font-family:'Fraunces',serif;font-size:52px;color:#E9E4D8}
  .season b{color:#F4F1EA}
  .subtle{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:3px;color:#9A9184;text-transform:uppercase}
  .spacer{flex:1}
  .cta{font-family:'Fraunces',serif;font-size:58px;font-weight:600}
  .cta b{color:#E7473C}
  .foot{margin-top:40px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff1f;padding-top:32px}
  .handle{font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:2px;color:#F4F1EA}
  .algo{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:3px;color:#9A9184;text-transform:uppercase}
</style></head>
<body><div class="reel">
  <div class="top"><div class="word">CHALK<span class="dot">.</span></div><div class="date">The receipts</div></div>
  <div class="kick">Yesterday</div>
  <div class="h1">We went<br><b>6 for 8.</b></div>
  <div class="season"><b>This season:</b> 61.5% of games called correctly.</div>
  <div class="subtle">43,583 graded · every pick locked before tip-off</div>
  <div class="spacer"></div>
  <div class="cta">New calls every morning.<br>Follow <b>@playthechalk</b>.</div>
  <div class="foot"><div class="handle">playthechalk.com</div><div class="algo">100% algorithmic · full record online</div></div>
</div></body></html>
