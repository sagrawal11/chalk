<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px}
  .reel{width:1080px;height:1920px;background:#F4F1EA;color:#16130F;font-family:'Inter',sans-serif;position:relative;padding:110px 80px 96px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:54px;letter-spacing:-1px}.word .d{color:#C1272D}
  .count{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:3px;color:#6B6459}
  .dots{margin-top:22px;display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;background:#16130F26}.dots i.on{background:#C1272D}
  .lead{margin-top:120px;font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:8px;color:#6B6459;text-transform:uppercase}
  .game{margin-top:34px;border-top:1px solid #16130F22;border-bottom:1px solid #16130F22;padding:30px 0}
  .row{display:flex;align-items:center;gap:34px;padding:34px 0}.row+.row{border-top:1px solid #16130F14}
  .dot{width:20px;height:20px;border-radius:50%;background:#16130F26;flex:none}.win .dot{background:#C1272D}
  .nm{flex:1;font-family:'Fraunces',serif;font-size:88px;font-weight:400;line-height:1}.win .nm{font-weight:700}
  .sc{font-family:'Fraunces',serif;font-size:150px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-3px}.win .sc{color:#C1272D}
  .verdict{margin-top:56px;font-family:'Fraunces',serif;font-size:60px}.verdict b{color:#C1272D}
  .conf{margin-top:44px;display:flex;align-items:center;gap:26px}
  .conf .k{font-family:'IBM Plex Mono',monospace;letter-spacing:4px;font-size:26px;color:#6B6459;text-transform:uppercase}
  .bar{flex:1;height:8px;background:#16130F18;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;width:78%;background:#C1272D}
  .pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px}
  .why{margin-top:46px;font-family:'Fraunces',serif;font-style:italic;font-size:44px;line-height:1.5;color:#6B6459}
  .grow{flex:1}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #16130F14;padding-top:32px}
  .handle{font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:2px}
  .algo{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:3px;color:#6B6459;text-transform:uppercase}
</style></head>
<body><div class="reel">
  <div>
    <div class="top"><div class="word">CHALK<span class="d">.</span></div><div class="count">Game 3 / 8</div></div>
    <div class="dots"><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="lead">Los Angeles · Boston</div>
  <div class="game">
    <div class="row win"><span class="dot"></span><span class="nm">Lakers</span><span class="sc">112</span></div>
    <div class="row"><span class="dot"></span><span class="nm">Celtics</span><span class="sc">108</span></div>
  </div>
  <div class="verdict">Our model calls the <b>Lakers</b>.</div>
  <div class="conf"><span class="k">Confidence</span><span class="bar"><i></i></span><span class="pct">78%</span></div>
  <div class="why">"Pace and offensive rebounding tilt a close one; Boston's on a road back-to-back."</div>
  <div class="grow"></div>
  <div class="foot"><div class="handle">@playthechalk</div><div class="algo">100% algorithmic · no odds</div></div>
</div></body></html>
