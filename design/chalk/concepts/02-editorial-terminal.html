<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  .card{width:1080px;height:1350px;background:#F4F1EA;color:#16130F;
    font-family:'Inter',sans-serif;position:relative;padding:72px 72px 60px}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:56px;letter-spacing:-1px}
  .word .dot{color:#C1272D}
  .date{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:2px;color:#6B6459;text-transform:uppercase}
  .rule{height:1px;background:#16130F22;margin:36px 0}
  .rule.thin{background:#16130F15}
  .label{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:5px;color:#6B6459;text-transform:uppercase}
  .match{margin-top:54px}
  .line{display:flex;align-items:center;justify-content:space-between;padding:30px 0}
  .line+.line{border-top:1px solid #16130F12}
  .side{display:flex;align-items:center;gap:26px}
  .mk{width:20px;height:20px;border-radius:50%;background:#16130F1a}
  .win .mk{background:#C1272D}
  .nm{font-family:'Fraunces',serif;font-size:60px;font-weight:400}
  .win .nm{font-weight:700}
  .sc{font-family:'IBM Plex Mono',monospace;font-size:96px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-2px}
  .win .sc{color:#C1272D}
  .verdict{margin-top:40px;font-family:'Fraunces',serif;font-size:40px}
  .verdict b{color:#C1272D}
  .conf{margin-top:44px;display:flex;align-items:center;gap:24px}
  .conf .k{font-family:'IBM Plex Mono',monospace;letter-spacing:4px;font-size:22px;color:#6B6459;text-transform:uppercase}
  .track{flex:1;height:6px;background:#16130F18;border-radius:6px;overflow:hidden}
  .track>i{display:block;height:100%;width:78%;background:#C1272D}
  .cpct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px}
  .why{margin-top:46px;font-family:'Fraunces',serif;font-style:italic;font-size:36px;line-height:1.5;color:#3a352d;max-width:920px}
  .foot{position:absolute;left:72px;right:72px;bottom:58px}
  .fr{display:flex;justify-content:space-between;align-items:center;padding-top:26px}
  .handle{font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:2px}
  .algo{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:3px;color:#6B6459;text-transform:uppercase}
</style></head>
<body><div class="card">
  <div class="top"><div class="word">CHALK<span class="dot">.</span></div><div class="date">NBA — Jan 17, 2026</div></div>
  <div class="rule"></div>
  <div class="label">Predicted result</div>
  <div class="match">
    <div class="line win"><div class="side"><span class="mk"></span><span class="nm">Los Angeles Lakers</span></div><div class="sc">112</div></div>
    <div class="line"><div class="side"><span class="mk"></span><span class="nm">Boston Celtics</span></div><div class="sc">108</div></div>
  </div>
  <div class="verdict">Our model calls the <b>Lakers</b>, 112–108.</div>
  <div class="conf"><span class="k">Confidence</span><span class="track"><i></i></span><span class="cpct">78%</span></div>
  <div class="why">"L.A.'s pace and offensive rebounding tilt a close one; Boston is on the back end of a road back-to-back."</div>
  <div class="foot"><div class="rule thin"></div><div class="fr"><div class="handle">@playthechalk</div><div class="algo">100% algorithmic · no odds used</div></div></div>
</div></body></html>
