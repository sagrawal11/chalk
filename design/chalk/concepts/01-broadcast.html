<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  .card{width:1080px;height:1350px;background:#0A0B0D;color:#fff;
    font-family:'Archivo',sans-serif;position:relative;overflow:hidden;padding:64px 64px 56px}
  .glow{position:absolute;top:-260px;right:-200px;width:640px;height:640px;border-radius:50%;
    background:radial-gradient(circle,#00E5FF33,transparent 70%)}
  .top{display:flex;justify-content:space-between;align-items:center;position:relative}
  .bug{font-family:'Oswald';font-weight:700;letter-spacing:4px;font-size:34px}
  .bug b{color:#00E5FF}
  .league{font-family:'Oswald';font-weight:600;letter-spacing:3px;color:#8A93A0;font-size:24px}
  .kicker{margin-top:70px;font-family:'Oswald';letter-spacing:6px;color:#00E5FF;font-size:24px;font-weight:600}
  .board{margin-top:26px;background:linear-gradient(180deg,#14171C,#0E1114);border:1px solid #1E232B;border-radius:26px;overflow:hidden}
  .row{display:flex;align-items:center;gap:32px;padding:46px 48px}
  .row+.row{border-top:1px solid #1E232B}
  .win{background:linear-gradient(90deg,#00E5FF14,transparent)}
  .win::before{content:"";position:absolute;left:0;width:8px;height:150px;background:#00E5FF;border-radius:0 8px 8px 0}
  .row{position:relative}
  .abbr{font-family:'Oswald';font-weight:700;font-size:40px;width:150px;height:150px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;letter-spacing:2px}
  .lal{background:#3b1e73;color:#FDB927}.bos{background:#0b3d2e;color:#fff}
  .team{flex:1}
  .team .name{font-family:'Oswald';font-weight:600;font-size:52px;line-height:1}
  .team .meta{color:#8A93A0;font-size:24px;margin-top:8px;letter-spacing:1px}
  .score{font-weight:800;font-size:132px;font-variant-numeric:tabular-nums;line-height:.8;letter-spacing:-3px}
  .win .score{color:#00E5FF}
  .tag{margin-left:20px;font-family:'Oswald';font-weight:700;letter-spacing:3px;color:#00E5FF;font-size:22px;align-self:flex-start;margin-top:10px}
  .conf{margin-top:40px;display:flex;align-items:center;gap:26px}
  .conf .lab{font-family:'Oswald';letter-spacing:4px;color:#8A93A0;font-size:24px}
  .bar{flex:1;height:16px;background:#161A20;border-radius:10px;overflow:hidden}
  .bar>i{display:block;height:100%;width:78%;background:linear-gradient(90deg,#00E5FF,#4dffd2)}
  .pct{font-weight:800;font-size:40px;color:#00E5FF;font-variant-numeric:tabular-nums}
  .why{margin-top:40px;font-size:33px;line-height:1.45;color:#D7DCE3;max-width:900px}
  .why b{color:#fff}
  .foot{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid #1E232B;padding-top:28px}
  .handle{font-family:'Oswald';letter-spacing:2px;font-size:28px;color:#fff}
  .algo{font-family:'Oswald';letter-spacing:3px;font-size:22px;color:#0A0B0D;background:#00E5FF;padding:10px 20px;border-radius:20px;font-weight:700}
</style></head>
<body><div class="card">
  <div class="glow"></div>
  <div class="top"><div class="bug"><b>◆</b> CHALK</div><div class="league">NBA · FRI JAN 17</div></div>
  <div class="kicker">TONIGHT'S CALL</div>
  <div class="board">
    <div class="row win"><div class="abbr lal">LAL</div><div class="team"><div class="name">Lakers</div><div class="meta">Los Angeles · Home</div></div><div class="score">112</div><div class="tag">WIN</div></div>
    <div class="row"><div class="abbr bos">BOS</div><div class="team"><div class="name">Celtics</div><div class="meta">Boston · Away</div></div><div class="score">108</div></div>
  </div>
  <div class="conf"><div class="lab">CONFIDENCE</div><div class="bar"><i></i></div><div class="pct">78%</div></div>
  <div class="why">L.A.'s pace and second-chance points overpower a Boston team on the tail of a road back-to-back. <b>Lakers by 4.</b></div>
  <div class="foot"><div class="handle">@playthechalk</div><div class="algo">100% ALGORITHMIC</div></div>
</div></body></html>
