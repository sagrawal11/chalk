<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px}
  .reel{width:1080px;height:1920px;background:#F4F1EA;color:#16130F;font-family:'Inter',sans-serif;position:relative;padding:110px 80px 96px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:52px;letter-spacing:-1px}.word .dot{color:#C1272D}
  .count{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:3px;color:#6B6459}
  .dots{margin-top:22px;display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;background:#16130F26}.dots i.on{background:#C1272D}
  .lead{margin-top:120px;font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:8px;color:#6B6459;text-transform:uppercase}
  .game{margin-top:40px;border-top:1px solid #16130F22;border-bottom:1px solid #16130F22;padding:40px 0}
  .line{display:flex;align-items:center;gap:32px;padding:30px 0}.line+.line{border-top:1px solid #16130F14}
  .chip{width:88px;height:88px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:32px;color:#fff;flex:none}
  .lal{background:#552583}.lal b{color:#FDB927}.bos{background:#007A33}
  .nm{flex:1;font-family:'Fraunces',serif;font-size:82px;font-weight:400;line-height:1}.win .nm{font-weight:700}
  .sc{font-family:'IBM Plex Mono',monospace;font-size:132px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-3px}.win .sc{color:#C1272D}
  .verdict{margin-top:60px;font-family:'Fraunces',serif;font-size:64px}.verdict b{color:#C1272D}
  .conf{margin-top:44px;display:flex;align-items:center;gap:26px}
  .conf .k{font-family:'IBM Plex Mono',monospace;letter-spacing:4px;font-size:26px;color:#6B6459;text-transform:uppercase}
  .bar{flex:1;height:8px;background:#16130F18;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;width:78%;background:#C1272D}
  .cpct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px}
  .why{margin-top:48px;font-family:'Fraunces',serif;font-style:italic;font-size:46px;line-height:1.5;color:#3a352d}
  .spacer{flex:1}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #16130F14;padding-top:32px}
  .handle{font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:2px}
  .algo{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:3px;color:#6B6459;text-transform:uppercase}
</style></head>
<body><div class="reel">
  <div>
    <div class="top"><div class="word">CHALK<span class="dot">.</span></div><div class="count">Game 3 / 8</div></div>
    <div class="dots"><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="lead">Los Angeles · Boston</div>
  <div class="game">
    <div class="line win"><span class="chip lal"><b>LAL</b></span><span class="nm">Lakers</span><span class="sc">112</span></div>
    <div class="line"><span class="chip bos">BOS</span><span class="nm">Celtics</span><span class="sc">108</span></div>
  </div>
  <div class="verdict">CHALK calls the <b>Lakers</b>.</div>
  <div class="conf"><span class="k">Confidence</span><span class="bar"><i></i></span><span class="cpct">78%</span></div>
  <div class="why">"Pace and offensive rebounding tilt a tight one; Boston's on a road back-to-back."</div>
  <div class="spacer"></div>
  <div class="foot"><div class="handle">@playthechalk</div><div class="algo">100% algorithmic · no odds</div></div>
</div></body></html>
