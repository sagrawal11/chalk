<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  .grid{width:1080px;height:1350px;background:#F4F1EA;color:#16130F;font-family:'Inter',sans-serif;position:relative;padding:70px 74px}
  .mono{font-family:'IBM Plex Mono',monospace}.serif{font-family:'Fraunces',serif}
  .gut{position:absolute;background:#16130F14}
  .gv{top:0;bottom:0;width:2px}.gh{left:0;right:0;height:2px}
  .r1{display:flex;justify-content:space-between;align-items:flex-start}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:96px;letter-spacing:-2px;line-height:.9}.word .dot{color:#C1272D}
  .tagl{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:4px;color:#6B6459;text-transform:uppercase}
  .algo{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:3px;color:#fff;background:#C1272D;padding:12px 18px;border-radius:8px}
  .hero{position:absolute;left:0;right:0;top:430px;text-align:center}
  .big{font-family:'Fraunces',serif;font-weight:700;font-size:300px;line-height:.8;letter-spacing:-8px;color:#C1272D}
  .heroLab{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:6px;color:#6B6459;text-transform:uppercase}
  .heroSub{margin-top:6px;font-family:'Fraunces',serif;font-style:italic;font-size:34px;color:#3a352d}
  .sports{position:absolute;left:74px;right:74px;bottom:190px;display:flex;justify-content:space-between}
  .sp{text-align:center}
  .sp .p{font-family:'Fraunces',serif;font-weight:700;font-size:76px;line-height:1}
  .sp .n{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:3px;color:#6B6459;margin-top:8px}
  .foot{position:absolute;left:74px;right:74px;bottom:70px;display:flex;justify-content:space-between;align-items:center}
  .handle{font-family:'Fraunces',serif;font-weight:700;font-size:40px}
  .rt{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:2px;color:#6B6459;text-transform:uppercase}
</style></head>
<body><div class="grid">
  <div class="gut gv" style="left:360px"></div><div class="gut gv" style="left:720px"></div>
  <div class="gut gh" style="top:450px"></div><div class="gut gh" style="top:900px"></div>
  <div class="r1"><div><div class="word">CHALK<span class="dot">.</span></div><div class="tagl">Every game. Every day. Called by a model.</div></div><div class="algo">100% ALGORITHMIC</div></div>
  <div class="hero"><div class="big">61.5%</div><div class="heroLab">straight-up winner accuracy</div><div class="heroSub">43,583 games graded &middot; no odds used, ever</div></div>
  <div class="sports">
    <div class="sp"><div class="p">66%</div><div class="n">NBA</div></div>
    <div class="sp"><div class="p">62%</div><div class="n">NFL</div></div>
    <div class="sp"><div class="p">58%</div><div class="n">NHL</div></div>
    <div class="sp"><div class="p">56%</div><div class="n">MLB</div></div>
  </div>
  <div class="foot"><div class="handle">@playthechalk</div><div class="rt">full track record · playthechalk.com</div></div>
</div></body></html>
