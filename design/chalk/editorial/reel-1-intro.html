<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px}
  .reel{width:1080px;height:1920px;background:#F4F1EA;color:#16130F;font-family:'Inter',sans-serif;position:relative;padding:110px 80px 96px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:64px;letter-spacing:-1px}
  .word .dot{color:#C1272D}
  .date{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:2px;color:#6B6459;text-transform:uppercase}
  .kick{margin-top:150px;font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:10px;color:#C1272D;text-transform:uppercase}
  .h1{font-family:'Fraunces',serif;font-size:150px;font-weight:700;line-height:.92;margin-top:30px;letter-spacing:-3px}
  .sub{margin-top:44px;font-family:'Fraunces',serif;font-size:46px;color:#3a352d;max-width:820px;line-height:1.35}
  .sub b{color:#16130F}
  .spacer{flex:1}
  .rec{border-top:1px solid #16130F22;padding-top:40px}
  .rec .k{font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:5px;color:#6B6459;text-transform:uppercase}
  .rec .v{margin-top:16px;font-family:'Fraunces',serif;font-size:52px}
  .rec .v b{color:#C1272D}
  .foot{margin-top:44px;display:flex;justify-content:space-between;align-items:center}
  .handle{font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:2px}
  .swipe{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:3px;color:#6B6459;text-transform:uppercase}
</style></head>
<body><div class="reel">
  <div class="top"><div class="word">CHALK<span class="dot">.</span></div><div class="date">Fri · Jan 17</div></div>
  <div class="kick">Today's calls</div>
  <div class="h1">8 games.<br>8 predictions.<br>0 odds.</div>
  <div class="sub">Every game tonight, called by our model before tip-off. <b>Winner and final score.</b></div>
  <div class="spacer"></div>
  <div class="rec">
    <div class="k">Track record</div>
    <div class="v"><b>61.5%</b> of games called correctly &middot; <b>43,583</b> graded</div>
  </div>
  <div class="foot"><div class="handle">@playthechalk</div><div class="swipe">swipe →</div></div>
</div></body></html>
