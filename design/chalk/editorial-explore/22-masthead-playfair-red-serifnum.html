<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif}
.card{width:1080px;height:1350px;padding:72px 74px 60px;display:flex;flex-direction:column;position:relative}
.word{font-family:var(--serif);font-weight:700;font-size:54px;letter-spacing:-1px}.word .d{color:var(--acc)}
.slate{font-family:var(--mono);font-size:20px;letter-spacing:2px;color:var(--mut);text-transform:uppercase}
.rule{height:1px;background:var(--hair);margin:28px 0}
.label{font-family:var(--mono);font-size:20px;letter-spacing:6px;color:var(--mut);text-transform:uppercase}
.verdict{font-family:var(--serif);font-size:40px}.verdict b{color:var(--acc)}
.conf{display:flex;align-items:center;gap:20px}
.conf .k{font-family:var(--mono);letter-spacing:4px;font-size:20px;color:var(--mut);text-transform:uppercase}
.bar{flex:1;height:6px;background:var(--hair);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
.pct{font-family:var(--mono);font-weight:600;font-size:28px}
.why{font-family:var(--serif);font-style:italic;font-size:31px;line-height:1.5;color:var(--mut)}
.grow{flex:1}
.foot{border-top:1px solid var(--hair);padding-top:22px;display:flex;justify-content:space-between;align-items:center}
.handle{font-family:var(--mono);font-size:22px;letter-spacing:2px}
.algo{font-family:var(--mono);font-size:18px;letter-spacing:3px;color:var(--mut);text-transform:uppercase}
/* rows */
.rows .match{margin-top:34px}
.rows .row{display:flex;align-items:center;gap:26px;padding:26px 0}.rows .row+.row{border-top:1px solid var(--hair)}
.rows .dot{width:15px;height:15px;border-radius:50%;background:var(--hair);flex:none}.rows .win .dot{background:var(--acc)}
.rows .nm{flex:1;font-family:var(--serif);font-size:58px;font-weight:400;line-height:1}.rows .win .nm{font-weight:700}
.rows .sc{font-family:var(--numfont);font-size:86px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px}.rows .win .sc{color:var(--acc)}
.rows .verdict{margin-top:32px}.rows .conf{margin-top:24px}.rows .why{margin-top:28px}
/* centered */
.centered .card{align-items:center;text-align:center}
.centered .lab2{margin-top:52px}
.centered .team{font-family:var(--serif);font-size:66px;line-height:1.15;font-weight:400}.centered .team.win{font-weight:700;color:var(--acc)}
.centered .vs{font-family:var(--mono);color:var(--mut);letter-spacing:5px;margin:10px 0;font-size:22px}
.centered .scores{margin-top:26px;font-family:var(--numfont);font-size:150px;font-weight:700;letter-spacing:-5px;line-height:1}
.centered .scores .w{color:var(--acc)}
.centered .verdict{margin-top:30px}.centered .conf{margin-top:26px;justify-content:center}.centered .why{margin-top:26px;max-width:820px}
/* bigtype */
.bigtype .lab2{margin-top:60px}
.bigtype .hero{font-family:var(--serif);font-weight:700;font-size:200px;line-height:.9;letter-spacing:-6px;color:var(--acc)}
.bigtype .over{font-family:var(--serif);font-size:56px;color:var(--mut);margin-top:6px}
.bigtype .sl{margin-top:30px;font-family:var(--numfont);font-size:80px;font-weight:700;letter-spacing:-2px}
.bigtype .conf{margin-top:30px}.bigtype .why{margin-top:28px}
/* masthead */
.masthead .card{text-align:center;align-items:center}
.masthead .mh{width:100%;border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:22px 0;margin-top:4px}
.masthead .mhw{font-family:var(--serif);font-weight:700;font-size:92px;letter-spacing:-1px}.masthead .mhw .d{color:var(--acc)}
.masthead .dl{font-family:var(--mono);font-size:19px;letter-spacing:5px;color:var(--mut);text-transform:uppercase;margin-top:14px}
.masthead .hl{margin-top:60px;font-family:var(--serif);font-size:70px;line-height:1.1;font-weight:700}.masthead .hl b{color:var(--acc)}
.masthead .why{margin-top:26px;max-width:840px}
.masthead .tab{margin-top:34px;font-family:var(--mono);font-size:26px;letter-spacing:2px;color:var(--ink);display:flex;gap:24px}
.masthead .tab .mut{color:var(--mut)}
/* terminal */
.terminal .card{font-family:var(--mono)}
.terminal .tw{font-family:var(--mono);font-weight:600;font-size:40px;letter-spacing:1px}
.terminal .blk{margin-top:44px;border:1px solid var(--hair);border-radius:10px;padding:34px 36px}
.terminal .kv{display:flex;justify-content:space-between;font-size:30px;padding:14px 0;border-bottom:1px dashed var(--hair)}
.terminal .kv:last-child{border-bottom:0}
.terminal .kv .n{font-variant-numeric:tabular-nums}
.terminal .win{color:var(--acc)}
.terminal .cf{margin-top:34px;font-size:26px;letter-spacing:1px}
.terminal .why{font-family:var(--mono);font-style:normal;font-size:26px;line-height:1.5;margin-top:30px}
</style></head>
<body style="--bg:#F4F1EA;--ink:#16130F;--mut:#6B6459;--acc:#C1272D;--hair:#16130F1f;--serif:'Playfair Display',serif;--mono:'IBM Plex Mono',monospace;--numfont:'Playfair Display',serif"><div class="card masthead">
    <div class="mh"><div class="mhw">CHALK<span class="d">.</span></div></div>
    <div class="dl">The daily algorithm · NBA, JAN 17</div>
    <div class="hl"><b>Lakers</b> edge Celtics,<br>112&ndash;108.</div>
    <div class="why">"L.A.'s pace and offensive rebounding tilt a close one; Boston is on the back end of a road back-to-back."</div>
    <div class="tab"><span>LAL <b>112</b></span><span class="mut">·</span><span>BOS <b>108</b></span><span class="mut">·</span><span class="mut">WIN PROB 78%</span></div>
    <div class="grow"></div>
    <div class="foot" style="width:100%"><div class="handle">@playthechalk</div><div class="algo">100% algorithmic · no odds</div></div></div></body></html>
