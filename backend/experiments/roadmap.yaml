# CHALK feature-experiment roadmap — machine-readable, PRE-REGISTERED.
#
# Order = the prioritized queue (held loosely). This file is the pre-committed plan:
# every experiment's keep_rule is fixed BEFORE the result is seen (the honesty guard
# against multiple-comparisons p-hacking). The runner NEVER rewrites this file — what
# actually ran (and was kept/dropped) is recorded in the append-only ledger
# (artifacts/experiments_ledger.jsonl). Builder IDs resolve to feature columns via
# experiments/champion.py::FEATURE_BUILDERS.
#
# status: queued        -> buildable now (columns exist in the frame), awaiting a run
#         needs_builder -> requires new feature-engineering code first (not buildable
#                          from the cached schedule frame yet; see FEATURE_ROADMAP.md)

defaults:
  keep_rule:
    metric: winner_logloss     # primary walk-forward metric (lower is better)
    improve: lower
    min_delta: 0.0005          # challenger must beat the champion by at least this
    guard_metric: margin_mae   # secondary guard: must not worsen
    guard_improve: lower

sports:
  nfl:
    baseline_version: nfl-v1   # Rung-1 box-score champion (M1)
    baseline_builders: [NFL-01, NFL-02, NFL-03, NFL-04, NFL-05]
    experiments:
      - id: NFL-06
        rung: 2
        name: Last-3-game form (FORM)
        builders: [NFL-06]
        hypothesis: Recent point-differential form captures in-season change the season average smooths over.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: NFL-10
        rung: 3
        name: Opponent-adjusted offense
        builders: [NFL-10]
        hypothesis: Raw scoring is inflated/deflated by schedule; adjusting for the defenses faced isolates true offense.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: NFL-11
        rung: 3
        name: Opponent-adjusted defense
        builders: [NFL-11]
        hypothesis: A defense that only faced weak offenses looks better than it is; adjusting reveals true defensive strength.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: NFL-14
        rung: 4
        name: Rest days & rest differential
        builders: [NFL-14]
        hypothesis: More rest than the opponent is a real edge; the rest gap should move margin.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: NFL-37
        rung: 7
        name: Divisional-game flag
        builders: [NFL-37]
        hypothesis: Familiar division rivals play tighter, lower-variance games — margins compress toward zero.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: NFL-38
        rung: 7
        name: Weather — wind & temperature
        builders: [NFL-38]
        hypothesis: High wind and extreme cold suppress passing/kicking, lowering totals.
        eval_metric: total_mae
        act: 1
        status: queued
      # ---- Rungs that need a new feature-builder first (not buildable from the
      #      cached schedule frame; wired in a later phase — see FEATURE_ROADMAP.md) ----
      - {id: NFL-07, rung: 2, name: Recency-weighted OFF/DEF (EWMA), builders: [NFL-07], act: 1, status: needs_builder}
      - {id: NFL-19, rung: 5, name: Offensive EPA/play (needs PBP), builders: [NFL-19], act: 1, status: needs_builder}
      - {id: NFL-45, rung: 8, name: Market-anchor residual & CLV probe, builders: [NFL-45], act: probe, status: needs_builder}

  mlb:
    baseline_version: mlb-v1   # Rung-1 box-score champion (M7)
    baseline_builders: [MLB-01, MLB-02, MLB-03, MLB-04, MLB-05]
    experiments:
      - id: MLB-06
        rung: 2
        name: Last-10-game form (FORM)
        builders: [MLB-06]
        hypothesis: A hot or cold stretch captures in-season change that the season run average smooths over.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: MLB-20
        rung: 3
        name: Starting pitcher — rolling runs allowed (SP_RA)
        builders: [MLB-20]
        hypothesis: The team that scores runs isn't who takes the mound; who's pitching tonight should move the line more than any team-level stat. This is the MLB analog of NFL's QB.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: MLB-21
        rung: 3
        name: Starting pitcher — rolling ERA (SP_ERA)
        builders: [MLB-21]
        hypothesis: Earned-run average isolates the starter's own runs from the bullpen — a sharper pitcher signal than the coarse SP_RA team-runs-allowed proxy.
        eval_metric: winner_logloss
        act: 1
        status: queued
        # NOTE: building SP_ERA runs a one-time per-pitcher game-log backfill
        # (statsapi people/{id}/stats; ~100+ calls/season, cached thereafter).
        # Every other MLB feature builds from the already-cached schedule.
      - id: MLB-07
        rung: 2
        name: Rest days & rest differential
        builders: [MLB-07]
        hypothesis: Days off matter less in a near-daily sport, but a rested bullpen and travel gaps could still move margin.
        eval_metric: winner_logloss
        act: 1
        status: queued

  nhl:
    baseline_version: nhl-v1   # Rung-1 box-score champion (M7)
    baseline_builders: [NHL-01, NHL-02, NHL-03, NHL-04, NHL-05]
    experiments:
      - id: NHL-06
        rung: 2
        name: Last-10-game form (FORM)
        builders: [NHL-06]
        hypothesis: A recent hot/cold streak captures momentum and injuries that the season goal average smooths over.
        eval_metric: winner_logloss
        act: 1
        status: queued
      - id: NHL-07
        rung: 2
        name: Rest days & rest differential
        builders: [NHL-07]
        hypothesis: NHL schedules are dense with back-to-backs; a tired team on the second night, or a rest edge over the opponent, should move margin.
        eval_metric: winner_logloss
        act: 1
        status: queued
      # ---- Needs a new feature-builder first (not in the cached schedule frame) ----
      # The starting GOALIE is the dominant NHL swing, but the schedule endpoint only
      # exposes the post-game winning goalie; a pre-game goalie signal needs the
      # boxscore endpoint (a new builder) — see FEATURE_ROADMAP.md.
      - {id: NHL-20, rung: 3, name: Starting goalie — rolling save%/GAA, builders: [NHL-20], act: 1, status: needs_builder}

  soccer:
    baseline_version: soccer-v1   # Rung-1 baseline Poisson 3-way champion (M7)
    baseline_builders: [SOC-01]
    # Soccer is 3-way (home/draw/away): the keep-rule is on THREE-way logloss, not the
    # binary winner_logloss. Guarded so three-way accuracy can't drop. Pre-registered.
    keep_rule:
      metric: three_way_logloss
      improve: lower
      min_delta: 0.001
      guard_metric: three_way_acc
      guard_improve: higher
    experiments:
      - id: SOC-02
        rung: 2
        name: Dixon-Coles low-score correction
        builders: [SOC-02]
        hypothesis: The independent-Poisson model under-predicts draws; the Dixon-Coles correlation correction on 0-0/1-0/0-1/1-1 should better calibrate the draw and improve 3-way log-loss.
        eval_metric: three_way_logloss
        act: 1
        status: queued
      - id: SOC-03
        rung: 2
        name: Cross-season prior (cold-start fix)
        builders: [SOC-03]
        hypothesis: Ratings reset to neutral each August; carrying a shrunk prior-season strength into the early season should sharpen predictions before the rolling window fills.
        eval_metric: three_way_logloss
        act: 1
        status: queued
      - id: SOC-04
        rung: 3
        name: Stronger home-field prior
        builders: [SOC-04]
        hypothesis: A single empirical home multiplier may understate home advantage; a larger prior could fit the home-win rate better — or overshoot (an honest test).
        eval_metric: three_way_logloss
        act: 1
        status: queued
